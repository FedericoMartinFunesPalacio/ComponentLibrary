<app-demo-shell item="data-table" [code]="code">
  <div class="table-card">
    <div class="table-toolbar">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="table-search">
        <mat-label>Buscar</mat-label>
        <input
          matInput
          [formControl]="filterCtrl"
          placeholder="Nombre, rol o equipo..." />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>
      <span class="table-count">{{ dataSource.filteredData.length }} resultados</span>
    </div>

    <div class="table-wrap">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let row">
            <span class="table-chip">{{ row.rol }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="equipo">
          <th mat-header-cell *matHeaderCellDef>Equipo</th>
          <td mat-cell *matCellDef="let row">{{ row.equipo }}</td>
        </ng-container>

        <ng-container matColumnDef="anios">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Años</th>
          <td mat-cell *matCellDef="let row">{{ row.anios }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [colSpan]="displayedColumns.length">
            Sin resultados para “{{ filterCtrl.value }}”.
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
  </div>
</app-demo-shell>
