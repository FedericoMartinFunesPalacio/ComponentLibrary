<app-demo-shell item="icon-buttons" [code]="code">
  <div class="icon-row">
    <button mat-icon-button aria-label="Editar">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="primary" aria-label="Favorito">
      <mat-icon>favorite</mat-icon>
    </button>
    <button mat-icon-button color="warn" aria-label="Eliminar">
      <mat-icon>delete</mat-icon>
    </button>
    <button mat-icon-button disabled aria-label="Bloqueado">
      <mat-icon>lock</mat-icon>
    </button>

    <span class="icon-separator"></span>

    <button mat-icon-button matBadge="4" matBadgeColor="primary" aria-label="Notificaciones">
      <mat-icon>notifications</mat-icon>
    </button>
    <button
      mat-icon-button
      matBadge="12"
      matBadgeColor="accent"
      matBadgeSize="small"
      aria-label="Carrito">
      <mat-icon>shopping_cart</mat-icon>
    </button>
    <button
      mat-icon-button
      matBadge="99+"
      matBadgeColor="warn"
      matBadgeSize="small"
      aria-label="Mensajes">
      <mat-icon>mail</mat-icon>
    </button>
  </div>
</app-demo-shell>
