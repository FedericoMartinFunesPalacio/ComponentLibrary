<app-demo-shell item="dialogs" [code]="code">

    <button mat-flat-button color="warn" (click)="openConfirm()">
      <mat-icon>delete</mat-icon>
      Eliminar proyecto

    <p class="dialog-result">
      <mat-icon>radio_button_unchecked</mat-icon>
      Último resultado: <strong>{{ lastResult() }}</strong>
    </p>
  </div>
</app-demo-shell>
